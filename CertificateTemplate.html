<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: Arial, sans-serif; margin: 0; padding: 40px; color: #1e293b; }
  .border { border: 6px solid #c2410c; padding: 40px; text-align: center; }
  .title { font-size: 14px; letter-spacing: 4px; color: #64748b; text-transform: uppercase; }
  h1 { font-size: 28px; margin: 8px 0 24px; color: #1e293b; }
  .name { font-size: 26px; font-weight: bold; margin: 16px 0 4px; color: #c2410c; }
  .company { font-size: 15px; color: #64748b; margin-bottom: 24px; }
  .desc { font-size: 14px; color: #334155; margin-bottom: 24px; line-height: 1.6; }
  table.meta { margin: 0 auto; font-size: 13px; color: #334155; }
  table.meta td { padding: 4px 12px; text-align: left; }
  .footer { margin-top: 32px; display: flex; justify-content: space-between; align-items: center; }
  .certno { font-family: monospace; font-size: 13px; color: #64748b; }
</style>
</head>
<body>
  <div class="border">
    <div class="title">Sertifikat Safety Talk Digital</div>
    <h1>PT Energi Batubara Lestari</h1>
    <div style="font-size:14px;color:#64748b">Diberikan kepada</div>
    <div class="name"><?= cert.nama ?></div>
    <div class="company">NIK <?= cert.nikMasked ?> — <?= cert.companyName ?></div>
    <div class="desc">
      Telah mengikuti dan dinyatakan <strong>LULUS</strong> sesi Safety Talk Digital<br>
      dengan topik <strong><?= cert.topicTitle ?></strong>
    </div>
    <table class="meta">
      <tr><td>Tanggal</td><td>: <?= cert.tanggal ?></td></tr>
      <tr><td>Skor</td><td>: <?= cert.score ?>%</td></tr>
      <tr><td>No. Sertifikat</td><td>: <?= cert.certificateNo ?></td></tr>
    </table>
    <div class="footer">
      <div class="certno">Verifikasi: <?= verifyUrl ?></div>
      <img src="<?= qrDataUri ?>" width="90" height="90" alt="QR">
    </div>
  </div>
</body>
</html>
