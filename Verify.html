<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Source Sans 3', sans-serif; background:#f1f5f9; color:#334155;
      display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; padding:24px;
    }
    .card { background:#fff; border:1px solid #e2e8f0; border-radius:16px; padding:32px; max-width:420px; width:100%; text-align:center; }
    h1 { font-family:'Lexend', sans-serif; font-size:20px; margin:8px 0; }
    dl { text-align:left; margin-top:20px; }
    .row { display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid #f1f5f9; font-size:14px; }
    .row dt { color:#64748b; }
    .row dd { margin:0; font-weight:600; color:#1e293b; }
    img.qr { margin-top:16px; }
  </style>
</head>
<body>
  <div class="card">
    <? if (cert) { ?>
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#047857" stroke-width="2"><circle cx="12" cy="12" r="9"/><path stroke-linecap="round" stroke-linejoin="round" d="m8.5 12.5 2.5 2.5 5-5"/></svg>
      <h1 style="color:#047857">Sertifikat Valid</h1>
      <dl>
        <div class="row"><dt>Nama</dt><dd><?= cert.nama ?></dd></div>
        <div class="row"><dt>NIK</dt><dd><?= cert.nikMasked ?></dd></div>
        <div class="row"><dt>Perusahaan</dt><dd><?= cert.companyName ?></dd></div>
        <div class="row"><dt>Topik</dt><dd><?= cert.topicTitle ?></dd></div>
        <div class="row"><dt>Tanggal</dt><dd><?= cert.tanggal ?></dd></div>
        <div class="row"><dt>Skor</dt><dd><?= cert.score ?>%</dd></div>
        <div class="row"><dt>No. Sertifikat</dt><dd><?= cert.certificateNo ?></dd></div>
      </dl>
      <img class="qr" src="<?= qrImageUrl ?>" width="150" height="150" alt="QR verifikasi">
    <? } else { ?>
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#b91c1c" stroke-width="2"><circle cx="12" cy="12" r="9"/><path stroke-linecap="round" d="m9.5 9.5 5 5m0-5-5 5"/></svg>
      <h1 style="color:#b91c1c">Sertifikat Tidak Ditemukan</h1>
      <p style="color:#64748b">Token verifikasi tidak valid atau sertifikat tidak pernah diterbitkan.</p>
    <? } ?>
  </div>
</body>
</html>
